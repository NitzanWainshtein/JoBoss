openapi: 3.0.3
info:
  title: JoBoss API
  description: REST API for the JoBoss job discovery platform
  version: 1.0.0

servers:
  - url: https://{apiId}.execute-api.us-east-1.amazonaws.com/prod
    description: AWS API Gateway (prod)
    variables:
      apiId:
        description: API Gateway ID (output of setup_all.py)
        default: your-api-id

security:
  - CognitoAuth: []

components:
  securitySchemes:
    CognitoAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito ID token — obtained via Amplify Auth

  schemas:
    Job:
      type: object
      properties:
        jobId:       { type: string }
        title:       { type: string }
        company:     { type: string }
        location:    { type: string }
        salary:      { type: string }
        description: { type: string }
        applyUrl:    { type: string }
        lat:         { type: number }
        lng:         { type: number }

    Swipe:
      type: object
      properties:
        jobId:      { type: string }
        decision:   { type: string, enum: [right, left] }
        swipedAt:   { type: string, format: date-time }

    Application:
      type: object
      properties:
        applicationId:    { type: string }
        jobId:            { type: string }
        company:          { type: string }
        title:            { type: string }
        status:           { type: string, enum: [applied, interviewing, rejected, offered] }
        tailoredResumeUrl:{ type: string }
        appliedAt:        { type: string, format: date-time }

    UserProfile:
      type: object
      properties:
        userId:           { type: string }
        fullName:         { type: string }
        email:            { type: string }
        plan:             { type: string, enum: [FREE, PREMIUM, PREMIUM_PLUS] }
        role:             { type: string }
        preferredLocation:{ type: string }
        desiredRole:      { type: string }
        experienceLevel:  { type: string }
        autoApply:        { type: boolean }
        resumes:
          type: array
          items:
            type: object
            properties:
              resumeId:   { type: string }
              fileName:   { type: string }
              resumeUrl:  { type: string }
              uploadedAt: { type: string }
              active:     { type: boolean }

    Error:
      type: object
      properties:
        error:   { type: string }
        message: { type: string }

# ── Jobs ──────────────────────────────────────────────────────────────────────
paths:
  /jobs:
    get:
      summary: Get job listings
      description: |
        Returns jobs filtered by location/radius and scored against the caller's
        preferences, best match first. No job is dropped by scoring — low scores
        simply sort last, tagged with `matchesPreferences: false` so the client can
        separate its primary deck from discovery.

        The order is a deterministic total order (score descending, then `jobId`),
        which is what makes offset paging safe: scores tie constantly and the
        underlying scan order is not guaranteed to repeat.

        **Pagination is opt-in.** Without `limit` the full result set is returned,
        as it always was, so older clients keep working. With `limit`, a typical
        account's first response drops from ~494KB to ~151KB. This matters beyond
        bandwidth: Lambda caps a synchronous response at 6MB, and at ~2.3KB per job
        the unpaginated list reaches that around 2,600 jobs, at which point the
        endpoint fails outright rather than degrading.
      parameters:
        - in: query
          name: lat
          schema: { type: number }
          description: Latitude for geo filter
        - in: query
          name: lng
          schema: { type: number }
          description: Longitude for geo filter
        - in: query
          name: radius
          schema: { type: number }
          description: Radius in km
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
          description: |
            Page size. Omit to return everything (legacy behaviour). Values above
            200 are capped; an unparseable value is ignored rather than treated as
            zero, so a malformed request can never return an empty deck.
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
          description: Index to start from. Negative or unparseable values become 0.
      responses:
        '200':
          description: A page of scored jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  count:
                    type: integer
                    description: Jobs in THIS response (equals total when unpaginated)
                  filters:
                    type: object
                    description: Geo and scoring diagnostics
                  page:
                    type: object
                    properties:
                      total:      { type: integer, description: Matches across the whole result set }
                      offset:     { type: integer }
                      limit:      { type: integer, nullable: true, description: null when unpaginated }
                      paginated:  { type: boolean }
                      hasMore:    { type: boolean }
                      nextOffset:
                        type: integer
                        nullable: true
                        description: Offset for the next page; null at the end of the list
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'

  /jobs/{jobId}:
    get:
      summary: Get a single job
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404':
          description: Job not found

# ── Swipes ────────────────────────────────────────────────────────────────────
  /swipes:
    post:
      summary: Record a swipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, decision]
              properties:
                jobId:    { type: string }
                decision: { type: string, enum: [right, left] }
      responses:
        '200':
          description: Swipe recorded
        '429':
          description: Daily swipe quota reached

  /swipes/me:
    get:
      summary: Get my swipe history
      responses:
        '200':
          description: List of swipes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Swipe' }

  /swipes/{jobId}:
    delete:
      summary: Undo a swipe
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Swipe removed

  /swipes/quota:
    get:
      summary: Get remaining swipe quota
      responses:
        '200':
          description: Quota status
          content:
            application/json:
              schema:
                type: object
                properties:
                  used:      { type: integer }
                  limit:     { type: integer }
                  remaining: { type: integer }

# ── Applications ──────────────────────────────────────────────────────────────
  /applications:
    get:
      summary: Get my applications
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Application' }

    post:
      summary: Create an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId]
              properties:
                jobId:             { type: string }
                company:           { type: string }
                title:             { type: string }
                tailoredResumeUrl: { type: string }
      responses:
        '200':
          description: Application created

    put:
      summary: Update application status or clear tailoring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId]
              properties:
                jobId:          { type: string }
                status:         { type: string }
                clearTailoring: { type: boolean }
      responses:
        '200':
          description: Application updated

# ── Users ─────────────────────────────────────────────────────────────────────
  /users/me:
    get:
      summary: Get my profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '404':
          description: Profile not found

    post:
      summary: Create profile (first login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email]
              properties:
                fullName:         { type: string }
                email:            { type: string }
                plan:             { type: string }
                role:             { type: string }
                preferredLocation:{ type: string }
                desiredRole:      { type: string }
                experienceLevel:  { type: string }
                autoApply:        { type: boolean }
      responses:
        '200':
          description: Profile created

    put:
      summary: Update my profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfile' }
      responses:
        '200':
          description: Profile updated

# ── Resumes ───────────────────────────────────────────────────────────────────
  /resumes/upload:
    post:
      summary: Upload a resume PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file, fileName]
              properties:
                file:     { type: string, description: Base64-encoded PDF }
                fileName: { type: string }
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  resumeId:   { type: string }
                  resumeUrl:  { type: string }
                  fileName:   { type: string }
                  uploadedAt: { type: string }

# ── Profile Image ─────────────────────────────────────────────────────────────
  /profile/image:
    post:
      summary: Upload a profile image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image:    { type: string, description: Base64-encoded image (max 5MB) }
                fileName: { type: string }
      responses:
        '200':
          description: Image uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageUrl: { type: string }

# ── AI ────────────────────────────────────────────────────────────────────────
  /ai/tailor:
    post:
      summary: Tailor a resume to a job description
      description: Uses Amazon Bedrock (Claude) to rewrite the resume for the target role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resume_text:     { type: string, description: Plain text resume (optional if PDF uploaded) }
                job_description: { type: string }
                jobId:           { type: string }
                resumeId:        { type: string }
                force:           { type: boolean, description: Skip relevance check }
      responses:
        '200':
          description: Tailored resume
          content:
            application/json:
              schema:
                type: object
                properties:
                  tailoredText:      { type: string }
                  tailoredResumeUrl: { type: string }
                  mode:              { type: string }
        '400':
          description: Job not relevant to candidate profile
        '403':
          description: |
            AI tailoring is not available on the caller's plan (`AI_NOT_AVAILABLE`),
            or the monthly tailoring quota is exhausted.

  /ai/analyze-cv:
    post:
      summary: Analyse an uploaded CV
      description: |
        Extracts structured profile fields (role, seniority, skills, location) from
        the stored resume via Bedrock, and backfills them onto the user record.
        Used by the onboarding wizard to pre-fill preferences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resumeUrl: { type: string, description: 's3:// URL of the resume to analyse' }
      responses:
        '200':
          description: Extracted profile fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis: { type: object }
        '404':
          description: Resume not found

  /ai/explain-failure:
    post:
      summary: Explain why an auto-apply attempt failed
      description: |
        Generates (and caches on the application record) a human-readable Hebrew
        explanation for a failed Auto Apply run. Premium-only. The explanation is
        generated at most once per failure — subsequent calls return the cached copy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId: { type: string }
      responses:
        '200':
          description: Explanation (freshly generated or cached)
          content:
            application/json:
              schema:
                type: object
                properties:
                  explanation: { type: object }
                  cached:      { type: boolean }
        '403':
          description: Free plan — `NOT_AVAILABLE`

# ── Subscriptions ─────────────────────────────────────────────────────────────
  /subscriptions/me:
    get:
      summary: Get my subscription
      responses:
        '200':
          description: Subscription details
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:      { type: string }
                  status:    { type: string }
                  expiresAt: { type: string }

    delete:
      summary: Cancel subscription
      responses:
        '200':
          description: Subscription cancelled

  /subscriptions/checkout:
    post:
      summary: Create a Stripe checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, enum: [PREMIUM, PREMIUM_PLUS] }
      responses:
        '200':
          description: Checkout session URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkoutUrl: { type: string }

  /subscriptions/consume:
    post:
      deprecated: true
      summary: '[REMOVED] Consume one AI tailoring credit'
      description: |
        Always returns 410. Daily usage is derived by counting today's applications
        rather than kept in a separate counter, so there is nothing to consume.
        Retained in the spec only so callers understand the 410.
      responses:
        '410':
          description: Endpoint removed — quota is counted from applications

  /subscriptions/webhook:
    post:
      summary: Stripe webhook
      description: |
        Receives Stripe subscription lifecycle events. Unauthenticated by design —
        Stripe cannot present a Cognito token. Authenticity is established instead by
        verifying the `Stripe-Signature` header against `STRIPE_WEBHOOK_SECRET`
        (`stripe.Webhook.construct_event`); an unsigned or mis-signed body is
        rejected with 400 before any state is touched.
      security: []
      parameters:
        - in: header
          name: Stripe-Signature
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Event processed (or deliberately ignored)
        '400':
          description: Invalid webhook signature

# ── Admin ─────────────────────────────────────────────────────────────────────
  /admin/{proxy+}:
    x-amazon-apigateway-any-method:
      summary: Admin operations
      description: |
        Admin dashboard endpoints, routed through a single Lambda.

        Requires a Cognito ID token **and** membership of the `ADMIN` group. The
        Lambda rejects every non-OPTIONS request with 403 before routing if
        `is_admin()` fails — checked from the authorizer claims, with a direct
        Cognito `admin_list_groups_for_user` fallback for tokens issued before the
        group was assigned. Every mutating action is written to the log as
        `[ADMIN_AUDIT]`.

        Includes: job management, user management, quota/swipe reset, analytics.
      parameters:
        - in: path
          name: proxy
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Admin response
        '403':
          description: Caller is not in the ADMIN group
