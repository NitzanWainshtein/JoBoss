name: CI

# Pre-merge gate, and the check for pushes that deploy.yml ignores (backend-only
# changes don't touch the bundle, so they never trigger a deploy — but they still
# have to be green).
#
# deploy.yml re-runs these same checks before it ships. That duplication is
# deliberate: the deploy proves the exact commit it is about to publish is green,
# rather than inferring it from a separate workflow's history.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src/
      - run: node scripts/check-i18n.mjs
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3 pytest
      - run: pytest backend/tests -q
        env:
          AWS_DEFAULT_REGION: us-east-1
