name: Deploy frontend

# Deploys only what is committed on main, and only after CI has passed on that
# exact commit. Replaces running deploy_frontend.ps1 from a laptop, which built
# from the working tree — so uncommitted (or half-finished) code could reach
# production and nothing recorded what was actually shipped.
on:
  push:
    branches: [main]
    # Backend and docs changes cannot affect the static bundle.
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  # Manual button, for redeploying the current main without an empty commit.
  workflow_dispatch:

# No long-lived AWS keys. GitHub mints a short-lived OIDC token that the
# joboss-github-deploy role trusts, scoped to this repo's main branch only.
permissions:
  contents: read
  id-token: write

# Never let two deploys interleave: they would race on S3 and each invalidate a
# tree the other had partly overwritten. Queue instead of cancelling, so a merged
# commit is never silently skipped.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  BUCKET: joboss-frontend-171109860478
  DISTRIBUTION_ID: E1E8CVAQ0HQE8E

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npx eslint src/
      - name: i18n parity
        working-directory: frontend
        run: node scripts/check-i18n.mjs
      - name: Frontend tests
        working-directory: frontend
        run: npm run test:run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend tests
        run: |
          pip install boto3 pytest
          pytest backend/tests -q
        env:
          AWS_DEFAULT_REGION: us-east-1

  deploy:
    name: Build and deploy
    needs: verify
    runs-on: ubuntu-latest
    # Deliberately NO `environment:`. Declaring one changes the OIDC token's `sub`
    # claim from `repo:OWNER/REPO:ref:refs/heads/main` to
    # `repo:OWNER/REPO:environment:production`, which the role's trust policy does
    # not match — the first attempt at this failed with
    # "Not authorized to perform sts:AssumeRoleWithWebIdentity" for exactly that
    # reason.
    #
    # Trusting the environment form instead would work, but it is looser: the sub
    # carries no branch, so any branch declaring `environment: production` could
    # assume the role. Pinning to the branch needs no GitHub-side configuration to
    # be safe. To add approval gates later, add the environment back, trust the
    # environment sub, AND restrict that environment's deployment branches to main
    # — all three, or the branch pin is lost.
    steps:
      - uses: actions/checkout@v4
        with:
          # version.json records the commit; a shallow clone is enough for that,
          # but fetch-depth 0 keeps `git describe`-style lookups working if the
          # build info plugin ever needs history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Vite inlines VITE_* at build time from frontend/.env, which is gitignored
      # and therefore absent here. Without them the build silently fell back to
      # `BASE_URL = 'mock'` and shipped a production bundle serving fabricated data
      # — no profile, no CV, an empty admin panel, and returning users pushed back
      # into onboarding. vite.config.js now fails the build instead, but these must
      # be supplied regardless.
      #
      # Not secrets: every one of these is inlined into the JavaScript that is
      # served to every visitor, so they are public by construction. Cognito IDs
      # and the API URL are identifiers, not credentials — the API is protected by
      # the Cognito authorizer, not by their obscurity.
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://pi6i87ag1c.execute-api.us-east-1.amazonaws.com/prod
          VITE_USER_POOL_ID: us-east-1_a8enAwcyl
          VITE_USER_POOL_CLIENT_ID: 5o1mg9dtkh7kjuvqu145oafv00
          VITE_COGNITO_DOMAIN: joboss.auth.us-east-1.amazoncognito.com
          VITE_CLOUDFRONT_URL: https://d231wno34rvped.cloudfront.net

      - name: Show what is about to ship
        working-directory: frontend
        run: cat dist/version.json

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::171109860478:role/joboss-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Order and cache headers mirror infrastructure/deploy/deploy_frontend.ps1.
      # See that script for why each one is the way it is; the important parts:
      #   - no --delete on assets, or a deploy 404s the lazy chunks of any session
      #     that is currently open
      #   - index.html and version.json go LAST and are never cached
      - name: Upload hashed assets (1y immutable)
        working-directory: frontend
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload icons (1h cache)
        working-directory: frontend
        run: |
          aws s3 cp dist/icons "s3://$BUCKET/icons" --recursive \
            --cache-control "public, max-age=3600"
          aws s3 sync dist/icons "s3://$BUCKET/icons" --delete \
            --cache-control "public, max-age=3600"

      - name: Upload remaining root files (1h cache)
        working-directory: frontend
        run: |
          aws s3 cp dist "s3://$BUCKET" --recursive \
            --exclude "assets/*" --exclude "icons/*" \
            --exclude "index.html" --exclude "version.json" --exclude "sw.js" \
            --cache-control "public, max-age=3600"

      # sw.js is diffed byte-for-byte by the browser to detect an update — at any
      # cache duration that detection would lag by however long the cache holds.
      - name: Upload index.html, version.json, and sw.js (no-cache)
        working-directory: frontend
        run: |
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"
          aws s3 cp dist/version.json "s3://$BUCKET/version.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json"
          aws s3 cp dist/sw.js "s3://$BUCKET/sw.js" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/javascript"

      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query "Invalidation.Id" --output text)
          echo "invalidation: $ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" --id "$ID"

      # Proves the deploy actually took, rather than trusting that it did.
      - name: Verify the live site serves this commit
        run: |
          LIVE=$(curl -fsS "https://d231wno34rvped.cloudfront.net/version.json")
          echo "$LIVE"
          LIVE_SHA=$(echo "$LIVE" | python3 -c "import json,sys; print(json.load(sys.stdin)['commit'])")
          if [ "$LIVE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::live site reports $LIVE_SHA but this run deployed $GITHUB_SHA"
            exit 1
          fi
          echo "live site confirmed on $LIVE_SHA"

      # Smoke test the thing that actually broke once: a bundle that builds and
      # deploys perfectly but never calls the API. vite.config.js already refuses to
      # build without VITE_API_URL, so this is the second line of defence — it also
      # catches a bundle pointed at the *wrong* API, which the build guard cannot.
      # --compressed matters: CloudFront serves brotli, and grepping the compressed
      # bytes silently matches nothing and passes.
      - name: Verify the live bundle talks to the API
        run: |
          BUNDLE=$(curl -fsS --compressed "https://d231wno34rvped.cloudfront.net/index.html" \
            | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          echo "bundle: $BUNDLE"
          JS=$(curl -fsS --compressed "https://d231wno34rvped.cloudfront.net/$BUNDLE")

          if ! echo "$JS" | grep -q "pi6i87ag1c.execute-api.us-east-1.amazonaws.com/prod"; then
            echo "::error::live bundle does not reference the API — it would serve no or mock data"
            exit 1
          fi
          if echo "$JS" | grep -q "mock-user"; then
            echo "::error::live bundle contains mock fixtures — VITE_USE_MOCK leaked into a real build"
            exit 1
          fi
          echo "live bundle references the production API and carries no mock fixtures"

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- https://d231wno34rvped.cloudfront.net"
            echo "- https://d231wno34rvped.cloudfront.net/version.json"
          } >> "$GITHUB_STEP_SUMMARY"
