<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoBoss</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      min-height: 200px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9ff;
      color: #1E2A4A;
    }

    .header {
      background: linear-gradient(135deg, #6C4FD4, #1E2A4A);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo { font-size: 22px; }
    .header-title { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
    .header-sub { font-size: 11px; opacity: 0.75; }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #eee;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6C4FD4;
      margin-bottom: 8px;
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6C4FD4, #4A90E2);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: white;
      flex-shrink: 0;
    }
    .profile-name { font-weight: 700; font-size: 14px; }
    .profile-email { font-size: 12px; color: #777; }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover { transform: scale(1.02); }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    .btn-primary {
      background: linear-gradient(135deg, #6C4FD4, #1E2A4A);
      color: white;
    }
    .btn-secondary {
      background: white;
      color: #6C4FD4;
      border: 2px solid #6C4FD4;
      margin-top: 8px;
    }

    .cv-box {
      background: white;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #444;
      line-height: 1.6;
      max-height: 120px;
      overflow-y: auto;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .cv-placeholder {
      color: #aaa;
      font-style: italic;
      font-size: 12px;
      text-align: center;
      padding: 16px;
    }

    .status {
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
      margin-top: 8px;
    }
    .status-success { background: #E8F5E9; color: #2E7D32; }
    .status-error   { background: #FFEBEE; color: #C62828; }
    .status-warn    { background: #FFF8E1; color: #F57F17; }

    .login-prompt {
      padding: 24px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .login-prompt .icon { font-size: 40px; }
    .login-prompt p { font-size: 13px; color: #555; }

    .loading {
      padding: 32px;
      text-align: center;
      color: #999;
      font-size: 13px;
    }

    #status-msg { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">💼</div>
    <div>
      <div class="header-title">JoBoss</div>
      <div class="header-sub">Auto Fill · CV Assist</div>
    </div>
  </div>

  <div id="loading" class="loading">טוען...</div>
  <div id="login-view" class="login-prompt" style="display:none">
    <div class="icon">🔒</div>
    <p>יש להתחבר לאפליקציית JoBoss<br/>כדי להשתמש בתוסף</p>
    <a href="https://d231wno34rvped.cloudfront.net" target="_blank" class="btn btn-primary" style="text-decoration:none;display:block;padding:11px;text-align:center;">
      פתח JoBoss ↗
    </a>
  </div>

  <div id="main-view" style="display:none">
    <div class="section">
      <div class="section-title">הפרופיל שלך</div>
      <div class="profile-row">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div class="profile-name" id="profile-name">—</div>
          <div class="profile-email" id="profile-email">—</div>
        </div>
      </div>
    </div>

    <div class="section">
      <button class="btn btn-primary" id="fill-btn">⚡ מלא טופס אוטומטית</button>
      <div id="status-msg" class="status"></div>
    </div>

    <div class="section">
      <div class="section-title">קורות חיים מותאמים</div>
      <div id="cv-content" class="cv-placeholder">אין קורות חיים מותאמים למשרה הנוכחית</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
