name: CI

# Pre-merge gate, and the check for pushes that deploy.yml ignores (backend-only
# changes don't touch the bundle, so they never trigger a deploy — but they still
# have to be green).
#
# deploy.yml re-runs these same checks before it ships. That duplication is
# deliberate: the deploy proves the exact commit it is about to publish is green,
# rather than inferring it from a separate workflow's history.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src/
      - run: node scripts/check-i18n.mjs
      # vite.config.js refuses to build without these (see the comment there — a
      # production deploy once shipped mock data because they were silently
      # absent). This job only proves the app BUILDS, it never deploys anywhere,
      # so these are placeholders, not real infrastructure — deploy.yml's build
      # step carries the real ones. Since a7f5473 added the guard, this step had
      # been failing on every push for a day because only deploy.yml got the
      # variables; CI stayed red the whole time and nothing paged on it.
      - run: npm run build
        env:
          VITE_API_URL: https://ci-placeholder.execute-api.us-east-1.amazonaws.com/prod
          VITE_USER_POOL_ID: us-east-1_ciplaceholder
          VITE_USER_POOL_CLIENT_ID: ciplaceholderclientid

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3 pytest
      - run: pytest backend/tests -q
        env:
          AWS_DEFAULT_REGION: us-east-1
