<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoBoss</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      min-height: 200px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8f9ff;
      color: #1E2A4A;
    }

    .header {
      background: linear-gradient(135deg, #6C4FD4, #1E2A4A);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo { font-size: 22px; }
    .header-title { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
    .header-sub { font-size: 11px; opacity: 0.75; }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #eee;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6C4FD4;
      margin-bottom: 8px;
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6C4FD4, #4A90E2);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: white;
      flex-shrink: 0;
    }
    .profile-name { font-weight: 700; font-size: 14px; }
    .profile-email { font-size: 12px; color: #777; }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover { transform: scale(1.02); }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    .btn:disabled { opacity: 0.6; cursor: default; transform: none; }
    .btn-primary {
      background: linear-gradient(135deg, #6C4FD4, #1E2A4A);
      color: white;
    }
    .btn-secondary {
      background: white;
      color: #6C4FD4;
      border: 2px solid #6C4FD4;
      margin-top: 8px;
    }
    .btn-ghost {
      background: transparent;
      color: #999;
      border: 1px solid #ddd;
      font-weight: 600;
      font-size: 13px;
    }

    .login-input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      direction: rtl;
      font-family: inherit;
    }
    .login-input:focus { border-color: #6C4FD4; }

    .cv-box {
      background: white;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #444;
      line-height: 1.6;
      max-height: 120px;
      overflow-y: auto;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .cv-placeholder {
      color: #aaa;
      font-style: italic;
      font-size: 12px;
      text-align: center;
      padding: 16px;
    }

    .status {
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
      margin-top: 8px;
    }
    .status-success { background: #E8F5E9; color: #2E7D32; }
    .status-error   { background: #FFEBEE; color: #C62828; }
    .status-warn    { background: #FFF8E1; color: #F57F17; }

    .login-prompt {
      padding: 22px 16px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .login-prompt .icon { font-size: 38px; }
    .login-prompt p.lead { font-size: 14px; color: #333; font-weight: 700; }
    .login-error { color: #C62828; font-size: 12px; display: none; margin: 2px 0 0; }
    .login-hint { font-size: 11px; color: #6C4FD4; text-decoration: none; margin-top: 4px; }
    .divider {
      display: flex; align-items: center; gap: 8px;
      width: 100%; font-size: 11px; color: #aaa; margin: 4px 0;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px; background: #e5e5e5;
    }

    .loading {
      padding: 32px;
      text-align: center;
      color: #999;
      font-size: 13px;
    }

    #status-msg { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">💼</div>
    <div>
      <div class="header-title">JoBoss</div>
      <div class="header-sub">Auto Fill · CV Assist</div>
    </div>
  </div>

  <div id="loading" class="loading">טוען...</div>

  <!-- In-popup login form (no new tab) -->
  <div id="login-view" class="login-prompt" style="display:none">
    <div class="icon">🔒</div>
    <p class="lead">התחבר לחשבון JoBoss שלך</p>
    <button id="sso-btn" class="btn btn-primary">🔗 התחבר דרך JoBoss</button>
    <div class="divider">או עם אימייל וסיסמה</div>
    <input type="email" id="login-email" class="login-input" placeholder="אימייל" autocomplete="username" />
    <input type="password" id="login-password" class="login-input" placeholder="סיסמה" autocomplete="current-password" />
    <button id="login-btn" class="btn btn-secondary" style="margin-top:0;">התחבר</button>
    <p id="login-error" class="login-error"></p>
    <a href="https://d231wno34rvped.cloudfront.net" target="_blank" class="login-hint">אין לך חשבון? הירשם ↗</a>
  </div>

  <div id="main-view" style="display:none">
    <div class="section">
      <div class="section-title">הפרופיל שלך</div>
      <div class="profile-row">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div class="profile-name" id="profile-name">—</div>
          <div class="profile-email" id="profile-email">—</div>
        </div>
      </div>
    </div>

    <div class="section">
      <!-- CV selector — visible only for Premium users with a tailored CV for this job -->
      <div id="cv-selector" style="display:none; flex-direction:column; gap:6px; margin-bottom:10px;">
        <div style="font-size:11px; font-weight:700; color:#6C4FD4; text-transform:uppercase; letter-spacing:0.5px;">קורות חיים לצרף</div>
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:#1E2A4A;">
          <input type="radio" name="cv-choice" id="cv-radio-tailored" />
          קורות חיים מותאמים למשרה ✨
        </label>
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; color:#555;">
          <input type="radio" name="cv-choice" id="cv-radio-original" />
          קורות חיים מקוריים
        </label>
      </div>
      <button class="btn btn-primary" id="fill-btn">⚡ מלא טופס אוטומטית</button>
      <div id="status-msg" class="status"></div>
    </div>

    <div class="section">
      <div class="section-title">קורות חיים מותאמים</div>
      <div id="cv-content" class="cv-placeholder">אין קורות חיים מותאמים למשרה הנוכחית</div>
    </div>

    <div class="section" style="border-bottom:none;">
      <button class="btn btn-ghost" id="logout-btn">התנתק</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
